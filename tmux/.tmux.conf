# inspired by:
#  aziz: https://github.com/aziz/dotfiles/blob/master/tmux.conf
#  wired: http://dev.gentoo.org/~wired/conf/tmux.conf
#  technomancy: https://github.com/technomancy/dotfiles/blob/master/.tmux.conf
#  jeffwar: https://github.com/jeffwar/dotfiles/blob/master/.tmux.conf

# keybinds
set -g prefix `                   # use tilde key as prefix
bind `     send-key `             # insert tilde by pressing twice
bind ,     previous-window
bind .     next-window
bind <     swap-window -t :-
bind >     swap-window -t :+
bind |     split-window -h        # split into left and right panes
bind \     split-window -h
bind -     split-window -v        # split into top and bottom panes
bind o     rotate-window          # rotate panes around in current window
bind Left  resize-pane -L 5
bind Right resize-pane -R 5
bind Up    resize-pane -U 5
bind Down  resize-pane -D 5
bind v     select-layout even-horizontal
bind V     select-layout main-vertical
bind h     select-layout even-vertical
bind H     select-layout main-horizontal
bind t     select-layout tiled
bind n     command-prompt 'rename-window %%'
bind N     command-prompt 'rename-session %%'
bind x     kill-pane
bind X     kill-window
bind r     source-file ~/.tmux.conf \; display-message " * reloaded ~/.tmux.conf"
bind q     select-pane -U         # move panes Up
bind a     select-pane -D         # ... Down
bind w     select-pane -L         # ... Left 
bind s     select-pane -R         # ... RIght

# behavior
set  -g base-index 1          # start window numbering from 1 instead of 0
setw -g pane-base-index 1     # ... and pane numbering too
set  -g renumber-windows on   # close gaps in window numbers after closing one
setw -g automatic-rename on   # automatically name windows
set  -g set-titles on         # auto set the terminal's window title

# Enable mouse control (clickable windows, panes, resizable panes)
set -g mouse on

## appearance
set  -g default-terminal "screen-256color"      # full colors for apps
set  -g status-left-length 45

# don't do anything when a 'bell' rings
set -g visual-activity off
set -g visual-bell off
set -g visual-silence off
setw -g monitor-activity off
set -g bell-action none

# clock mode
setw -g clock-mode-colour colour1

# copy mode
setw -g mode-style 'fg=colour1 bg=colour18 bold'
setw -g mode-keys vi
bind -T copy-mode-vi v send -X begin-selection
bind -T copy-mode-vi C-v send -X rectangle-toggle

# system clipboard: OSC 52 (works over ssh too) + native tool when available
set -s set-clipboard on
set -g @copy_cmd "sh -c 'if command -v pbcopy >/dev/null; then pbcopy; elif command -v wl-copy >/dev/null; then wl-copy; elif command -v xclip >/dev/null; then xclip -selection clipboard; else cat >/dev/null; fi'"
bind -T copy-mode-vi y              send -X copy-pipe-and-cancel "#{@copy_cmd}"
bind -T copy-mode-vi MouseDragEnd1Pane send -X copy-pipe-and-cancel "#{@copy_cmd}"

# pane borders
set -g pane-border-style 'fg=colour1'
set -g pane-active-border-style 'fg=colour3'

# statusbar
set -g status-position bottom
set -g status-justify left
set -g status-style 'fg=colour1'
set -g status-left ''
set -g status-right '%Y-%m-%d %H:%M '
set -g status-right-length 50
set -g status-left-length 10

setw -g window-status-current-style 'fg=colour0 bg=colour1 bold'
setw -g window-status-current-format ' #I #W #F '

setw -g window-status-style 'fg=colour1 dim'
setw -g window-status-format ' #I #[fg=colour7]#W #[fg=colour1]#F '

setw -g window-status-bell-style 'fg=colour2 bg=colour1 bold'

# messages
set -g message-style 'fg=colour2 bg=colour0 bold'

## nvim
set-option -sg escape-time 0
set-option -g focus-events on
set-option -sa terminal-features ',xterm-256color:RGB'
set-option -g history-limit 100000

## session persistence (plugins are git submodules, no TPM needed)
# tmux-resurrect: prefix + C-s saves, prefix + C-r restores windows, panes and their dirs
set -g @resurrect-capture-pane-contents 'on'
# tmux-continuum: autosave every 15 min and restore when the tmux server starts (e.g. after reboot)
set -g @continuum-restore 'on'
set -g @continuum-save-interval '15'
# must stay at the very end: continuum hooks into status-right
run-shell ~/.tmux/plugins/tmux-resurrect/resurrect.tmux
run-shell ~/.tmux/plugins/tmux-continuum/continuum.tmux
