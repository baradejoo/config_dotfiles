[general]
import = [
  "~/.config/alacritty/themes/themes/hardhacker.toml"
]

[env]
TERM = "xterm-256color"

[window]
padding.x = 10
padding.y = 28  # room for the transparent title bar buttons

decorations = "Transparent"
startup_mode = "Maximized"

opacity = 0.7
blur = false

option_as_alt = "Both"

[font]
normal.family = "LiterationMono Nerd Font"

size = 13

# Shift+Enter inserts a newline in Claude Code (added by its /terminal-setup)
[[keyboard.bindings]]
key = "Return"
mods = "Shift"
chars = "\u001B\r"
